name: Bug report
description: Something does the wrong thing or fails
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go to the [Security tab](https://github.com/denfry/WindowsCleaner/security/advisories/new), not here.
  - type: dropdown
    id: part
    attributes:
      label: Where
      options:
        - "Desktop app"
        - "Disk cleanup"
        - "Optimize / undo"
        - "Troubleshoot"
        - "Startup apps"
        - "Drivers"
        - "Apps (uninstall / winget)"
        - "Smart memory"
        - "Insights"
        - "Installer (install.ps1)"
        - "Scheduled tasks"
        - "Console menu"
        - "Batch file"
        - "Other"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WinSenior version
      description: Shown under the app name, or `Version` in a JSON report.
      placeholder: "6.5.1"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps or command line
      description: The buttons you pressed, or the full command with parameters.
      render: powershell
      placeholder: .\Cleanup-Windows-Senior.ps1 -Category Browsers -WhatIf
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        In the app: Log > Save. Console: `%TEMP%\WindowsCleanup.log` (or WindowsOptimize.log / WindowsRepair.log). Remove anything private.
      render: text
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Run `winver`.
      placeholder: Windows 11 24H2, build 26100.2314
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      description: "`$PSVersionTable.PSVersion`"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran it as Administrator
          required: true
        - label: I searched the open issues
          required: true
