name: Feature request
description: A new cleanup target, tweak, check, or change in behavior
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - "Cleanup target"
        - "Optimization tweak"
        - "Health check or repair"
        - "Desktop app"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: |
        Cleanup target: the exact folder paths and what recreates them.
        Tweak: the registry key and value, or the setting, and how to undo it.
        Check: what to detect and how to fix it.
        A link to Microsoft or vendor docs helps.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk tier
      description: Anything that can't be undone belongs in Dangerous.
      options:
        - "Safe (cache that rebuilds itself)"
        - "Moderate"
        - "Aggressive"
        - "Dangerous (can't be undone)"
        - "Not sure"
